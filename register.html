<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Register - SpeakerHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">Speaker<span>Hub</span></div>
    <nav><a class="muted-link" href="index.html">Home</a></nav>
</header>

<main>
    <section class="auth-page">
        <div class="auth-panel">
            <div class="auth-hero">
                <span class="eyebrow">New here?</span>
                <h1>Create a SpeakerHub account</h1>
                <p>Sign up to unlock exclusive speaker drops, deals, and order tracking.</p>
            </div>
            <form id="registerForm" class="auth-form" onsubmit="registerUser(); return false;">
                <div class="input-group">
                    <label for="register-username">Username</label>
                    <input id="register-username" type="text" placeholder="Your handle" autocomplete="username" required>
                </div>
                <div class="input-group">
                    <label for="register-name">Full Name</label>
                    <input id="register-name" type="text" placeholder="Your name" autocomplete="name" required>
                </div>
                <div class="input-group">
                    <label for="register-email">Email</label>
                    <input id="register-email" type="email" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="input-group">
                    <label for="register-password">Password</label>
                    <input id="register-password" type="password" placeholder="••••••••" autocomplete="new-password" required minlength="6">
                </div>
                <div class="input-group">
                    <label for="register-confirm">Confirm Password</label>
                    <input id="register-confirm" type="password" placeholder="••••••••" autocomplete="new-password" required minlength="6">
                </div>
                <div class="auth-actions">
                    <a class="secondary-link" href="login.html">Already have an account?</a>
                    <button type="submit" class="primary">Register</button>
                </div>
            </form>
        </div>
    </section>
</main>

<script src="script.js"></script>

</body>
</html>
