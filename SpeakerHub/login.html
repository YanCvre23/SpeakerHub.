<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login - SpeakerHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">Speaker<span>Hub</span></div>
    <nav><a class="muted-link" href="index.html">Home</a></nav>
</header>

<main>
    <section class="auth-page">
        <div class="auth-panel">
            <div class="auth-hero">
                <span class="eyebrow">Welcome back</span>
                <h1>Login to SpeakerHub</h1>
                <p>Sign in to access your cart, saved favorites, and faster checkout.</p>
            </div>
            <form id="loginForm" class="auth-form" onsubmit="loginUser(); return false;">
                <div class="input-group">
                    <label for="login-username">Email or Username</label>
                    <input id="login-username" type="text" placeholder="you@example.com" autocomplete="username" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <div class="auth-actions">
                    <label class="remember"><input type="checkbox">Remember me</label>
                    <button type="submit" class="primary">Login</button>
                </div>
                <p class="small-text">Don't have an account? <a class="secondary-link" href="register.html">Create one</a></p>
            </form>
        </div>
    </section>
</main>

<script src="script.js"></script>

</body>
</html>
